# cargo-dist 自定义 publish job：发布 npm 包装包到 npmjs.com。
# 被 .github/workflows/release.yml 的 custom-publish-npm job 以 workflow_call 调用。
#
# 鉴权：npm Trusted Publishing（OIDC）——不依赖密码 / API token，账号即使开启
# 「发布需 2FA」也无需 OTP（npm publish 带 --provenance 走 OIDC 身份交换）。
#
# 一次性前置（npm 侧）：npmjs.com → Access → 添加 trusted publisher：
#   Provider: GitHub
#   Repository: zhMoody/llmux-cli-rs
#   Workflow: release.yml   ← 关键！reusable workflow 场景 npm 校验 caller 文件名
#
# 发布依赖的 npm tarball（llmux-cli-<ver>-npm-package.tar.gz）由 cargo-dist 在
# build-global-artifacts 阶段生成并作为 workflow artifact 上传，这里下载后发布。
name: publish-npm

on:
  workflow_call:
    inputs:
      # dist 会把 plan JSON（含版本、release、artifact 列表）传进来
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC 令牌，供 npm publish --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      # trusted publishing 需要较新的 npm（≥11.5.1，随 Node 22.14+ 提供）
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # 下载 cargo-dist 各 job 上传的 artifacts（含 *-npm-package.tar.gz）
      - name: Fetch dist npm packages
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true

      # 逐个发布 plan 中带 npm tarball 的 release（provenance 由 OIDC 自动附加）
      - name: Publish npm packages with provenance
        run: |
          set -euo pipefail
          for release in $(echo "$PLAN" | jq -c '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq -r '.artifacts[] | select(endswith("-npm-package.tar.gz"))')
            echo "发布: ./npm/$pkg"
            npm publish --provenance --access public "./npm/$pkg"
          done
