# 一次性 OIDC 诊断 workflow（用后即删）：打印 token claims 核对 repository/workflow 字段
name: oidc-diag
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")
          echo "=== OIDC token claims ==="
          echo "$TOKEN" | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); p=d.get("value",""); import urllib.parse; p=urllib.parse.unquote(p); part=p.split(".")[1]; part+="="*(-len(part)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(part)), indent=2))'
