[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Where to host releases
hosting = "github"
# Homebrew tap to publish the formula to (repo name must start with "homebrew-")
tap = "zhMoody/homebrew-tap"
# npm 包名：Cargo 包名是 llmux，但 npm 裸名 llmux 被拒（与 flux 太相似），
# 统一发到 llmux-cli（账号名下已有该包，版本需 > npm 线上）
npm-package = "llmux-cli"
# Publish jobs run at the end of a release
# npm 发布不用内置 NODE_AUTH_TOKEN job，改用自定义 reusable workflow（./publish-npm）
# 走 OIDC + --provenance（dist 会给自定义 job 默认 id-token: write）
publish-jobs = ["homebrew", "./publish-npm"]
